name: Sync from godot-line Template

on:
  repository_dispatch:
    types: [template-updated]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/godotline/godot-line.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Check if already synced
        id: check
        run: |
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "has_update=false" >> $GITHUB_OUTPUT
            echo "✅ 已是最新"
          else
            echo "has_update=true" >> $GITHUB_OUTPUT
            echo "📦 检测到模板更新: ${{ github.event.client_payload.upstream_sha }}"
          fi

      - name: Create sync branch and merge
        if: steps.check.outputs.has_update == 'true'
        id: sync
        run: |
          BRANCH="sync/template-$(date +%s)"
          git checkout -b $BRANCH
          git merge upstream/master --no-edit
          git push origin $BRANCH
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check.outputs.has_update == 'true'
        run: |
          gh pr create \
            --title "Sync template: ${{ github.event.client_payload.pr_title }}" \
            --body "上游模板 PR #${{ github.event.client_payload.pr_number }} 已合并，自动同步更新。" \
            --base master \
            --head ${{ steps.sync.outputs.branch }} \
            --label template-sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
