name: Build ImGui iOS GDExtension

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Branch or tag in meny2333/dear-imgui-godot"
        required: false
        default: main
        type: string

env:
  RUST_NIGHTLY: nightly-2026-06-19
  IOS_TARGET: aarch64-apple-ios

jobs:
  build:
    name: iOS arm64
    runs-on: macos-14

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout Rust plugin source
        shell: bash
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          upstream_ref="${UPSTREAM_REF:-main}"
          git clone --depth=1 --branch "$upstream_ref" \
            https://github.com/meny2333/dear-imgui-godot.git upstream-imgui

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-19
          targets: aarch64-apple-ios

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream-imgui/imgui -> upstream-imgui/addons/dear-imgui-godot/target
          key: native-ios-arm64

      - name: Build debug and release
        working-directory: upstream-imgui/imgui
        shell: bash
        run: |
          set -euo pipefail
          cargo +"$RUST_NIGHTLY" build --profile editor --features editor-docs --target "$IOS_TARGET"
          cargo +"$RUST_NIGHTLY" build --release --target "$IOS_TARGET"

          output="$GITHUB_WORKSPACE/addons/dear-imgui-godot/target/ios"
          mkdir -p "$output/debug/arm64" "$output/release/arm64"
          cp "../addons/dear-imgui-godot/target/$IOS_TARGET/editor/libdear_imgui_godot.dylib" \
            "$output/debug/arm64/libdear_imgui_godot.dylib"
          cp "../addons/dear-imgui-godot/target/$IOS_TARGET/release/libdear_imgui_godot.dylib" \
            "$output/release/arm64/libdear_imgui_godot.dylib"

      - name: Verify binaries
        shell: bash
        run: |
          set -euo pipefail
          file addons/dear-imgui-godot/target/ios/debug/arm64/libdear_imgui_godot.dylib
          file addons/dear-imgui-godot/target/ios/release/arm64/libdear_imgui_godot.dylib
          xcrun lipo -info addons/dear-imgui-godot/target/ios/release/arm64/libdear_imgui_godot.dylib

      - name: Upload iOS binaries
        uses: actions/upload-artifact@v4
        with:
          name: dear-imgui-godot-ios-arm64
          if-no-files-found: error
          path: addons/dear-imgui-godot/target/ios
